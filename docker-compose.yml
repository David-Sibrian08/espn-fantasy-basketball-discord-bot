services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      # Bind-mounts single files so they survive container restarts/rebuilds
      # and so the running bot can actually see them - without this, both
      # only exist in the build context, never in the container's
      # filesystem. Each file must already exist on the host before first
      # run (Docker creates an empty directory instead if it doesn't) -
      # see README for the `touch` step and team_owners.json setup.
      - ./all_time_records.json:/app/all_time_records.json
      - ./team_owners.json:/app/team_owners.json
