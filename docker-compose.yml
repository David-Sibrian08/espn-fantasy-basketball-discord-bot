services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      # Bind-mounts a single file so the all-time record book survives
      # container restarts/rebuilds. The file must already exist on the
      # host before first run — see README for the `touch` step.
      - ./all_time_records.json:/app/all_time_records.json
